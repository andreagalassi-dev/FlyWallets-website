name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not paste real credentials, tokens or personal financial data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API)
        - Frontend (UI)
        - Database / schema
        - Authentication (login, OTP, password reset)
        - AI (categorization / insights)
        - Docs / tooling / CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Backend console output, browser console errors or screenshots. Remove any secrets first.
      render: shell
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.11.0"
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: "16"
  - type: input
    id: os
    attributes:
      label: OS and browser
      placeholder: macOS 15, Chrome 130
