name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flywallets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flywallets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load database schema
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d flywallets -f database/schema.sql

      - name: Create restricted RLS role
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d flywallets -v app_password="'ci_app_pass'" -f database/rls_app_role.sql

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          CI: "true"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flywallets
          TEST_DATABASE_APP_URL: postgresql://flywallets_app:ci_app_pass@localhost:5432/flywallets

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  docker:
    name: Docker (compose build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
        env:
          # Placeholders only so compose can interpolate; nothing is started and nothing is baked into the images.
          JWT_SECRET: ci-build-only-placeholder-not-a-secret-0123456789
          JWT_REFRESH_SECRET: ci-build-only-placeholder-not-a-secret-9876543210
