# FlyWallets PRODUCTION stack: Caddy (HTTPS, one domain) -> frontend (Next.js) + backend (Express) -> PostgreSQL.
# See deploy/README.md. Run from the repository root:
#
#   cp deploy/.env.production.example deploy/.env      # then edit it (DOMAIN + secrets)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Only Caddy publishes ports (80/443). PostgreSQL, the API and the web app are reachable only inside the compose network.
# Required variables use ${VAR:?message}: compose refuses to start when they are missing.

name: ${COMPOSE_PROJECT_NAME:-flywallets}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env (alphanumeric only)}
      POSTGRES_DB: flywallets
      # Password of the restricted `flywallets_app` role that makes Row-Level Security effective
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env (alphanumeric only)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run only on the first start of an EMPTY volume. schema.sql already contains everything for fresh installs
      # (for an existing database apply database/migrations/*.sql by hand, see deploy/README.md).
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/docker/02_rls_app_role.sh:/docker-entrypoint-initdb.d/02_rls_app_role.sh:ro
      - ../database/rls_app_role.sql:/opt/flywallets/rls_app_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flywallets"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Caddy is the single proxy hop in front of the API: rate limits use the real client IP
      TRUST_PROXY: "1"
      CLIENT_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env (public host name, no scheme)}
      DB_SSL: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/flywallets
      # Restricted role: Row-Level Security is enforced for accounts, transactions, goals, budgets...
      DATABASE_APP_URL: postgresql://flywallets_app:${APP_DB_PASSWORD}@postgres:5432/flywallets
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env (>= 32 random characters)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in deploy/.env (>= 32 random characters)}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
      RECURRING_SCHEDULER: ${RECURRING_SCHEDULER:-on}
      # Optional pass-through (empty = codes/links printed in the backend log, keyword categorization)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-FlyWallets <no-reply@flywallets.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    # No "ports": only reachable from the compose network (Caddy)

  frontend:
    build:
      context: ../frontend
      args:
        # Relative on purpose: the browser calls the API on the same origin (Caddy routes /api/* to the backend).
        # Inlined in the bundle at build time.
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    # No "ports" and no dependency on the backend: Caddy reaches it on the internal network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env (public host name, no scheme)}
      # "tls internal" (self-signed, local testing only) when TLS_INTERNAL is set to a non-empty value, else empty = real certificates
      TLS_DIRECTIVE: ${TLS_INTERNAL:+tls internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3 (QUIC) shares the HTTPS port number over UDP
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: keep this volume, or Let's Encrypt rate limits may bite after re-creating it
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
