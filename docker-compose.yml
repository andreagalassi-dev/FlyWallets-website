# FlyWallets full stack: PostgreSQL + API (Express) + web app (Next.js).
#
#   cp .env.example .env     # then fill JWT_SECRET / JWT_REFRESH_SECRET (see the file).
#   Left empty, the backend (NODE_ENV=development here) generates random secrets at startup and warns:
#   fine for a demo, but every restart logs everybody out.
#   docker compose up --build
#
# Web app: http://localhost:${FRONTEND_PORT:-3000}   API: http://localhost:${BACKEND_PORT:-5000}/api
# Seed demo data: docker compose exec backend node src/scripts/seed.js --force
#
# The stack runs the API with NODE_ENV=development on purpose: this is a plain-HTTP localhost setup and
# production mode would require HTTPS (secure cookies) and refuses the demo seed script.
# For a real deployment put a TLS reverse proxy in front and use NODE_ENV=production.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: flywallets
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-flywallets_app}
    ports:
      # Published on loopback only; containers reach it as postgres:5432
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first start (empty volume). schema.sql already contains everything for fresh installs.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Creates the restricted role used for Row-Level Security (see database/rls_app_role.sql)
      - ./database/docker/02_rls_app_role.sh:/docker-entrypoint-initdb.d/02_rls_app_role.sh:ro
      - ./database/rls_app_role.sql:/opt/flywallets/rls_app_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flywallets"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "5000"
      CLIENT_URL: ${CLIENT_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/flywallets
      # Restricted role: Row-Level Security is enforced for accounts, transactions, goals, budgets...
      DATABASE_APP_URL: postgresql://flywallets_app:${APP_DB_PASSWORD:-flywallets_app}@postgres:5432/flywallets
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      # Optional pass-through (empty = console fallback / keyword categorization)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-FlyWallets <no-reply@flywallets.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined in the browser bundle at build time: must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
